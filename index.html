<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin Preschel – Data Analytics Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background: linear-gradient(135deg, #e6e6e6, #ffffff);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ffffff;
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
    }
    header h1 {
      font-weight: 700;
      font-size: 2rem;
      background: linear-gradient(to right, #FF2F92, #531B93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    header p {
      font-weight: 400;
      font-size: 1rem;
    }
    nav {
      margin-top: 1rem;
    }
    nav a {
      margin: 0 1rem;
      color: #531B93;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 2rem;
      max-width: 900px;
      margin: auto;
      z-index: 2;
      position: relative;
    }
    section {
      margin-bottom: 3rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #FF2F92, #531B93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    ul {
      padding-left: 1.5rem;
    }
    ul li {
      margin-bottom: 0.75rem;
    }
    iframe {
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 1rem;
    }
    a {
      color: #0077cc;
    }
    a:hover {
      text-decoration: underline;
    }
    .button-row {
      display: flex;
      justify-content: flex-end;
      margin: 4rem auto 0 auto;
      max-width: 900px;
      padding: 0 1rem;
    }
    .button {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #531B93;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.3s;
      width: auto;
      max-width: 100%;
    }
    .button:hover {
      background-color: #3e1470;
    }
    footer {
      background-color: #ffffff;
      color: #531B93;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<!-- Content remains unchanged -->
</body>
</html>

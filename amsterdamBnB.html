<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmsterdamBnB</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background: linear-gradient(135deg, #e6e6e6, #ffffff);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ffffff;
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
    }
    header h1 {
      font-weight: 700;
      font-size: 2rem;
      background: linear-gradient(to right, #FF2F92, #531B93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    header p {
      font-weight: 400;
      font-size: 1rem;
    }
    header img.vaccine {
      position: absolute;
      right: 2rem;
      top: 1rem;
      height: 140px;
      opacity: 0.15;
      z-index: 1;
    }
    main {
      padding: 2rem;
      max-width: 900px;
      margin: auto;
      z-index: 2;
      position: relative;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #FF2F92, #531B93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h3 {
      font-weight: 700;
      color: #2c3e50;
    }
    section {
      margin-bottom: 3rem;
    }
    ul li {
      margin-bottom: 0.5rem;
    }
    p strong, ul strong {
      font-weight: 500;
    }
    img {
      width: 100%;
      height: auto;
      margin: 1rem 0 0.25rem 0;
    }
    a {
      color: #0077cc;
      display: block;
      margin-top: 0.25rem;
    }
    a:hover {
      text-decoration: underline;
    }
    .highlight-box {
      background: linear-gradient(to right, #FF2F92, #531B93);
      color: white;
      font-weight: 500;
      border-radius: 12px;
      display: inline-block;
      padding: 1rem;
      margin-top: 1.5rem;
      max-width: 100%;
    }
    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 4rem auto 0 auto;
      max-width: 900px;
      padding: 0 1rem;
    }
    .button {
      padding: 0.75rem 1.5rem;
      background-color: #531B93;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #3e1470;
    }
    footer {
      background-color: #ffffff;
      color: #531B93;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
    .emoji {
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: initial;
    }
  </style>
</head>
<body>
  <header>
    <h1>AmsterdamBnB</h1>
    <p>A data-driven exploration of Airbnb listings in Amsterdam.</p>
    <img src="images/vaccine.svg" alt="Decorative Icon" class="vaccine">
  </header>

  <main>
    <!-- Sections for Skills, Tools, Procedures, Overview, Insights, Modeling, Final Takeaways etc. to be added next -->
  </main>

  <div class="button-row">
    <a class="button" href="index.html">← Back to Start</a>
  </div>

  <footer>
    <p>&copy; 2025 Martin Preschel</p>
  </footer>
</body>
</html>
